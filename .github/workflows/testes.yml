name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.28
        ports:
          - 27017:27017
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash mvnw verify
