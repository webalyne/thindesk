spring.application.name=thindesk
spring.data.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/thindesk}
spring.data.mongodb.auto-index-creation=true
spring.security.user.name=${THINDESK_USER:admin}
spring.security.user.password=${THINDESK_PASSWORD:thindesk123}
spring.thymeleaf.cache=false
server.address=127.0.0.1
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jackson.default-property-inclusion=always
