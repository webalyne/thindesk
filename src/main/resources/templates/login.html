<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thindesk | Entrar</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/login.css}"></head>
<body class="login-page"><main class="login-card"><a class="brand login-brand" th:href="@{/login}"><span class="brand-mark">th.</span><span>thindesk</span></a><h1>Central de suporte</h1><p>Entre para acompanhar os chamados.</p><p class="form-error" th:if="${param.error}" role="alert">Usuário ou senha inválidos.</p><p th:if="${param.logout}" role="status">Você saiu do sistema.</p><form th:action="@{/login}" method="post"><label for="username">Usuário</label><input id="username" name="username" required autocomplete="username" autofocus><label for="password">Senha</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="button primary" type="submit">Entrar</button></form></main></body></html>
