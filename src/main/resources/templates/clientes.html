<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thindesk | Clientes</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"></head>
<body data-pagina="clientes">
<a class="skip" href="#conteudo">Ir para o conteúdo</a>
<aside th:replace="~{fragments/menu :: menu}"></aside>
<div class="shell"><header class="topbar"><span>Operação <span class="divider">/</span><strong>Clientes</strong></span></header>
<main id="conteudo" tabindex="-1"><div class="heading"><div><p class="eyebrow">CENTRAL DE SUPORTE</p><h1>Clientes</h1><p>Consulte os clientes cadastrados e seus setores.</p></div></div>
<section class="panel"><div class="table-scroll"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Setor</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(clientes)}"><td colspan="3" class="empty">Nenhum cliente cadastrado.</td></tr><tr th:each="cliente : ${clientes}"><td th:text="${cliente.nome}"></td><td th:text="${cliente.telefone}"></td><td th:text="${cliente.setor}"></td></tr></tbody></table></div></section>
<footer>Thindesk <span>Cadastro de clientes</span></footer></main></div>
</body></html>
